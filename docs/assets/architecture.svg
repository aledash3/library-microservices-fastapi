<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="nginxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009639"/>
      <stop offset="100%" stop-color="#006627"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009688"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#1d3f5e"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="480" y="42" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    Library Microservices Architecture Topology
  </text>
  <text x="480" y="65" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
    Docker Compose Orchestration • Nginx Gateway • FastAPI Services • PostgreSQL 13 • Hardened Network Isolation
  </text>

  <!-- CLIENT -->
  <g transform="translate(380, 85)" filter="url(#dropShadow)">
    <rect width="200" height="42" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="100" y="26" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      🌐 Client / Frontend / cURL
    </text>
  </g>

  <!-- Arrow Client -> Nginx -->
  <line x1="480" y1="127" x2="480" y2="155" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="146" fill="#79c0ff" font-family="monospace" font-size="11">:8080 (Host Port)</text>

  <!-- NETWORK: public_net -->
  <rect x="230" y="160" width="500" height="74" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="245" y="180" fill="#3fb950" font-family="monospace" font-size="10" font-weight="bold">NETWORK: public_net (bridge)</text>

  <!-- NGINX GATEWAY -->
  <g transform="translate(250, 185)" filter="url(#dropShadow)">
    <rect width="460" height="40" rx="6" fill="url(#nginxGrad)" stroke="#2ea043" stroke-width="1.5"/>
    <text x="230" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ⚡ Nginx API Gateway (Reverse Proxy &amp; Routing Engine)
    </text>
  </g>

  <!-- Arrows Nginx -> Microservices -->
  <line x1="330" y1="234" x2="200" y2="285" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="215" y="252" fill="#79c0ff" font-family="monospace" font-size="10">/api/books</text>

  <line x1="480" y1="234" x2="480" y2="285" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="490" y="262" fill="#79c0ff" font-family="monospace" font-size="10">/api/users</text>

  <line x1="630" y1="234" x2="760" y2="285" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="715" y="252" fill="#79c0ff" font-family="monospace" font-size="10">/api/orders</text>

  <!-- NETWORK: app_net -->
  <rect x="40" y="280" width="880" height="150" rx="12" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="55" y="302" fill="#58a6ff" font-family="monospace" font-size="11" font-weight="bold">NETWORK: app_net (internal: true — Isolated from Host)</text>

  <!-- BOOKS SERVICE -->
  <g transform="translate(60, 315)" filter="url(#dropShadow)">
    <rect width="260" height="100" rx="8" fill="#21262d" stroke="#009688" stroke-width="1.5"/>
    <rect width="260" height="26" rx="8" fill="url(#apiGrad)"/>
    <text x="130" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      📚 books_service (:5000)
    </text>
    <text x="12" y="46" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Framework: FastAPI 0.115</text>
    <text x="12" y="64" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Security: read_only | cap_drop: ALL</text>
    <text x="12" y="82" fill="#3fb950" font-family="monospace" font-size="10">✓ Swagger UI /docs enabled</text>
  </g>

  <!-- USERS SERVICE -->
  <g transform="translate(350, 315)" filter="url(#dropShadow)">
    <rect width="260" height="100" rx="8" fill="#21262d" stroke="#009688" stroke-width="1.5"/>
    <rect width="260" height="26" rx="8" fill="url(#apiGrad)"/>
    <text x="130" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      👤 users_service (:5000)
    </text>
    <text x="12" y="46" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Framework: FastAPI 0.115</text>
    <text x="12" y="64" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Security: non-root (UID 10001)</text>
    <text x="12" y="82" fill="#3fb950" font-family="monospace" font-size="10">✓ Pydantic Email &amp; Role Check</text>
  </g>

  <!-- ORDERS SERVICE -->
  <g transform="translate(640, 315)" filter="url(#dropShadow)">
    <rect width="260" height="100" rx="8" fill="#21262d" stroke="#009688" stroke-width="1.5"/>
    <rect width="260" height="26" rx="8" fill="url(#apiGrad)"/>
    <text x="130" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      🛒 orders_service (:5000)
    </text>
    <text x="12" y="46" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Framework: FastAPI 0.115</text>
    <text x="12" y="64" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Integrity: Foreign key &amp; stock sync</text>
    <text x="12" y="82" fill="#3fb950" font-family="monospace" font-size="10">✓ Async HTTP status validation</text>
  </g>

  <!-- Arrows Microservices -> DB -->
  <line x1="190" y1="415" x2="400" y2="480" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <line x1="480" y1="415" x2="480" y2="480" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <line x1="770" y1="415" x2="560" y2="480" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- NETWORK: db_net -->
  <rect x="200" y="465" width="560" height="135" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="215" y="485" fill="#d2a8ff" font-family="monospace" font-size="10" font-weight="bold">NETWORK: db_net (internal: true — SQL Layer)</text>

  <!-- POSTGRES DATABASE -->
  <g transform="translate(230, 495)" filter="url(#dropShadow)">
    <rect width="320" height="90" rx="8" fill="#21262d" stroke="#4169E1" stroke-width="1.5"/>
    <rect width="320" height="26" rx="8" fill="url(#dbGrad)"/>
    <text x="160" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      🐘 PostgreSQL 13 Database (db:5432)
    </text>
    <text x="12" y="46" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Databases: books_db, users_db, orders_db</text>
    <text x="12" y="64" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Healthcheck: pg_isready (interval: 10s)</text>
    <text x="12" y="80" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Ports: 0 exposed to public internet</text>
  </g>

  <!-- VOLUME -->
  <g transform="translate(570, 505)" filter="url(#dropShadow)">
    <rect width="170" height="70" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="1.5"/>
    <text x="85" y="26" fill="#f0883e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      💾 Docker Volume
    </text>
    <text x="85" y="44" fill="#c9d1d9" font-family="monospace" font-size="10" text-anchor="middle">
      postgres_data
    </text>
    <text x="85" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">
      Persistent Storage
    </text>
  </g>
</svg>